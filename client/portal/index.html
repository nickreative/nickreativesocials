<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Client Portal</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
body {
font-family: Helvetica, Arial, sans-serif;
padding: 24px;
}
.page {
  max-width: 1100px;   /* adjust if needed */
  margin: 0 auto;      /* this is the centring */
}
/* ---------- Layout ---------- */
.layout {
display: grid;
grid-template-columns: max-content 520px;
gap: 32px;
align-items: start;
}

/* ---------- Grid ---------- */
.grid {
display: grid;
width: fit-content;
grid-template-columns: repeat(3, 120px);
grid-template-rows: repeat(4, 150px); /* 5:4 vertical */
gap: 6px;
}

.grid img {
width: 100%;
height: 100%;
object-fit: cover;
border: 1px solid #ccc;
cursor: pointer;
}

/* ---------- Preview ---------- */
.preview {
width: 520px;
}
    
.carousel {
  position: relative;
  width: 100%;
  overflow: hidden;
  border: 1px solid #ccc;
  /* Optional default, JS will override */
  aspect-ratio: 4 / 5;
}


.carousel {
  position: relative;
  width: 100%;
  overflow: hidden;
  border: 1px solid #ccc;
  aspect-ratio: 4 / 5; /* fallback */
}

.carousel img,
.carousel video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;

  transform: translateX(100%);
  transition: transform 0.35s ease;
}

.carousel .active {
  transform: translateX(0);
}

.carousel .prev {
  transform: translateX(-100%);
}
.carousel-controls {
margin: 8px 0;
}


/* ---------- Actions ---------- */
.actions {
margin-top: 12px;
}
#caption {
  white-space: pre-line;
}

#caption,
#linkedinCaption {
  white-space: pre-line;
}

.linkedin-card {
  width: 100%;
  border: 1px solid #d9d9d9;
  background: #fff;
}

.linkedin-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 16px 12px;
}

.linkedin-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #eee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
}

.linkedin-meta {
  font-size: 14px;
  line-height: 1.3;
}

.linkedin-meta span {
  color: #666;
  font-size: 12px;
}

.linkedin-caption {
  padding: 0 16px 16px;
  font-size: 15px;
  line-height: 1.45;
}

.linkedin-media {
  display: grid;
  gap: 2px;
  background: #fff;
}

.linkedin-media.one {
  grid-template-columns: 1fr;
}

.linkedin-media.two {
  grid-template-columns: 1fr 1fr;
}

.linkedin-media.three {
  grid-template-columns: 2fr 1fr;
  grid-template-rows: repeat(2, 1fr);
}

.linkedin-media.four-plus {
  grid-template-columns: 2fr 1fr;
  grid-template-rows: repeat(3, 1fr);
}

.linkedin-tile {
  position: relative;
  overflow: hidden;
  background: #f3f3f3;
  min-height: 160px;
}

.linkedin-tile img,
.linkedin-tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.linkedin-media.three .linkedin-tile:first-child {
  grid-row: 1 / 3;
}

.linkedin-media.four-plus .linkedin-tile:first-child {
  grid-row: 1 / 4;
}

.linkedin-more {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.38);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: 600;
}
    
</style>
</head>
<body>
  <div class="page">

<h2 id="clientHeading"></h2>

<div class="layout">
  <div class="grid" id="grid"></div>

<div class="preview" id="preview" hidden>

  <div id="instagramPreview">
    <div id="carousel" class="carousel"></div>

    <div class="carousel-controls">
      <button id="prevBtn">←</button>
      <button id="nextBtn">→</button>
    </div>

    <p id="caption"></p>
  </div>

  <div id="linkedinPreview" hidden>
    <div class="linkedin-card">
      <div class="linkedin-header">
        <div class="linkedin-avatar">SB</div>
        <div class="linkedin-meta">
          <strong id="linkedinBrand">Client Preview</strong><br>
          <span>Preview only</span>
        </div>
      </div>

      <div id="linkedinCaption" class="linkedin-caption"></div>
      <div id="linkedinMedia" class="linkedin-media"></div>
    </div>
  </div>

  <div class="actions">
    <button id="approveBtn">Approve</button>
    <button id="changesBtn">Request changes</button>
  </div>
</div>
</div>


<script type="module">
  import { supabase } from "/assets/js/supabase.js";

  const { data: sessionData } = await supabase.auth.getSession();
  const user = sessionData?.session?.user;

  if (!user || user.user_metadata.role !== "client") {
    window.location.href = "/login/";
    throw new Error("Not authorised");
  }

  const client = user.user_metadata.client;
  document.getElementById("clientHeading").textContent =
    `Social previews — ${client}`;

 const { data: posts, error } = await supabase
  .from("posts")
  .select("*")
  .eq("client", client)
  .order("slot");

if (error) {
  alert("Failed to load posts");
  console.error(error);
}


const grid = document.getElementById("grid");
const preview = document.getElementById("preview");
const carousel = document.getElementById("carousel");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const captionEl = document.getElementById("caption");

const instagramPreview = document.getElementById("instagramPreview");
const linkedinPreview = document.getElementById("linkedinPreview");
const linkedinCaption = document.getElementById("linkedinCaption");
const linkedinMedia = document.getElementById("linkedinMedia");
const linkedinBrand = document.getElementById("linkedinBrand");

let slides = [];
let currentSlide = 0;
let currentPost = null;


function createMediaElement(url) {
  const cleanUrl = url.split("?")[0].toLowerCase();
  let el;

  if (cleanUrl.endsWith(".mp4") || cleanUrl.endsWith(".webm")) {
    el = document.createElement("video");
    el.src = url;
    el.muted = false;
    el.loop = true;
    el.playsInline = true;
    el.autoplay = true;
  } else {
    el = document.createElement("img");
    el.src = url;
  }

  return el;
}

function setPreviewMode(platform) {
  if (platform === "linkedin") {
    instagramPreview.hidden = true;
    linkedinPreview.hidden = false;
  } else {
    instagramPreview.hidden = false;
    linkedinPreview.hidden = true;
  }
}

function renderLinkedInMedia(urls) {
  linkedinMedia.innerHTML = "";

  const count = urls.length;
  if (!count) return;

  if (count === 1) linkedinMedia.className = "linkedin-media one";
  else if (count === 2) linkedinMedia.className = "linkedin-media two";
  else if (count === 3) linkedinMedia.className = "linkedin-media three";
  else linkedinMedia.className = "linkedin-media four-plus";

  const visibleUrls = urls.slice(0, 4);

  visibleUrls.forEach((url, index) => {
    const tile = document.createElement("div");
    tile.className = "linkedin-tile";

    const mediaEl = createMediaElement(url);
    tile.appendChild(mediaEl);

    if (count > 4 && index === 3) {
      const more = document.createElement("div");
      more.className = "linkedin-more";
      more.textContent = `+${count - 4}`;
      tile.appendChild(more);
    }

    linkedinMedia.appendChild(tile);
  });
}

function renderCarousel(post) {
  const platform = post?.platform || "instagram";

  setPreviewMode(platform);

  if (platform === "linkedin") {
    linkedinBrand.textContent = client;
    linkedinCaption.textContent = post.caption || "";
    renderLinkedInMedia(post.media_urls || []);
    return;
  }

  carousel.innerHTML = "";
  slides = [];
  currentSlide = 0;

  if (!post.media_urls || !post.media_urls.length) return;

  post.media_urls.forEach((url, index) => {
    const el = createMediaElement(url);

    if (index === 0) el.classList.add("active");

    carousel.appendChild(el);
    slides.push(el);
  });

  carousel.style.aspectRatio =
    post.aspect === "9:16" ? "9 / 16" : "4 / 5";

  carousel.style.maxHeight =
    post.aspect === "9:16" ? "924px" : "650px";
}

function showSlide(index) {
  slides.forEach((el, i) => {
    el.classList.toggle("active", i === index);
    el.classList.toggle("prev", i < index);

    if (el.tagName === "VIDEO") {
      i === index ? el.play() : el.pause();
    }
  });
}

prevBtn.onclick = () => {
  if (!slides.length) return;
  currentSlide = (currentSlide - 1 + slides.length) % slides.length;
  showSlide(currentSlide);
};

nextBtn.onclick = () => {
  if (!slides.length) return;
  currentSlide = (currentSlide + 1) % slides.length;
  showSlide(currentSlide);
};

posts.forEach(post => {
  if (!post) return;

  const img = document.createElement("img");
  img.src = post.thumbnail_url || "/assets/empty.png";

 img.addEventListener("click", () => {
  preview.hidden = false;
  renderCarousel(post);

  if ((post.platform || "instagram") === "linkedin") {
    captionEl.textContent = "";
  } else {
    captionEl.textContent = post.caption || "";
  }

  currentPost = post;
});
  grid.appendChild(img);
});



  function openMail(subject) {
    if (!currentPost) return;
    const body = encodeURIComponent(
      `Hi Nick,\n\n${subject}:\nSlot ${currentPost.slot}
"${currentPost.caption.slice(0, 80)}…"
\n`
    );
    window.location.href =
      `mailto:nicholasgoodridge@hotmail.com?subject=Social feedback&body=${body}`;
  }

  document.getElementById("approveBtn").onclick =
    () => openMail("I approve the following posts:");

  document.getElementById("changesBtn").onclick =
    () => openMail("Could you make changes to the following posts?");
</script>
  </div>
</body>
</html>
