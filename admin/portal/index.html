<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Portal</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    select {
      margin-bottom: 16px;
    }
.grid {
  display: grid;
  grid-template-columns: repeat(3, 120px);
  grid-template-rows: repeat(4, 150px); /* 5:4 vertical */
  gap: 6px;
}
.grid img {
  width: 100%;
  height: 100%;
  object-fit: cover;   /* enforces crop */
  aspect-ratio: 5 / 4;
  border: 1px solid #ccc;
  cursor: pointer;
}

    .preview {
      margin-top: 24px;
      max-width: 630px;
    }
    #caption {
  white-space: pre-line;
}

    .preview img {
      width: 100%;
      object-fit: cover;
      border: 1px solid #ccc;
    }
    .carousel {
  width: 100%;
  aspect-ratio: 4 / 5;
  position: relative;
  overflow: hidden;
  border: 1px solid #ccc;
}

.carousel {
  position: relative;
  width: 100%;
  overflow: hidden;
  border: 1px solid #ccc;
  aspect-ratio: 4 / 5; /* fallback */
}

.carousel img,
.carousel video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;

  transform: translateX(100%);
  transition: transform 0.35s ease;
}

.carousel .active {
  transform: translateX(0);
}

.carousel .prev {
  transform: translateX(-100%);
}
    .carousel-controls {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}

    
.layout {
  display: grid;
  grid-template-columns: 380px 520px;
  gap: 32px;
  align-items: start;
}
.preview {
  height: auto;
}

.carousel {
  height: auto;
}

#linkedinCaption,
#caption {
  white-space: pre-line;
}

.linkedin-card {
  width: 100%;
  border: 1px solid #d9d9d9;
  background: #fff;
}

.linkedin-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 16px 12px;
}

.linkedin-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #eee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
}

.linkedin-meta {
  font-size: 14px;
  line-height: 1.3;
}

.linkedin-meta span {
  color: #666;
  font-size: 12px;
}

.linkedin-caption {
  padding: 0 16px 16px;
  font-size: 15px;
  line-height: 1.45;
}

.linkedin-media {
  display: grid;
  gap: 2px;
  background: #fff;
}

.linkedin-media.one {
  grid-template-columns: 1fr;
}

.linkedin-media.two {
  grid-template-columns: 1fr 1fr;
}

.linkedin-media.three {
  grid-template-columns: 2fr 1fr;
  grid-template-rows: repeat(2, 1fr);
}

.linkedin-media.four-plus {
  grid-template-columns: 2fr 1fr;
  grid-template-rows: repeat(3, 1fr);
}

.linkedin-tile {
  position: relative;
  overflow: hidden;
  background: #f3f3f3;
  min-height: 160px;
}

.linkedin-tile img,
.linkedin-tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.linkedin-media.three .linkedin-tile:first-child {
  grid-row: 1 / 3;
}

.linkedin-media.four-plus .linkedin-tile:first-child {
  grid-row: 1 / 4;
}

.linkedin-more {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.38);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: 600;
}

#uploadProgress {
  font-size: 14px;
  color: #555;
}
    .left-column {
  width: 380px;
}

#editor {
  margin-top: 24px;
}
  </style>
</head>
<body>

<h2>Admin — Social Previews</h2>
<button id="addNewBtn" style="margin: 12px 0;">Add new post (shift grid)</button>
<label>
  Select client:
  <select id="clientSelect">
    <option value="suitecollection">Suite Collection</option>
    <option value="pocky">Pocky</option>
    <option value="vicalates">Vicalates</option>
    <option value="livencommunities">Liven Communities</option>
  </select>
</label>

<div class="layout">
  <div class="left-column">
    <div class="grid" id="grid"></div>

    <div id="editor" hidden>
      <h3>Edit post</h3>

      <label>
        Platform:
        <select id="platformSelect">
          <option value="instagram">Instagram</option>
          <option value="linkedin">LinkedIn</option>
        </select>
      </label>

      <br><br>

      <label>
        Aspect:
        <select id="aspectSelect">
          <option value="5:4">5:4 (grid / carousel)</option>
          <option value="9:16">9:16 (reel)</option>
        </select>
      </label>

      <br><br>

      <textarea id="captionInput" rows="4" cols="40"></textarea>

      <br><br>
      <hr>

      <label>
        Thumbnail:
        <input type="file" id="thumbInput" accept="image/*">
      </label>

      <br><br>

      <label>
        Media (images / videos):
        <input type="file" id="mediaInput" accept="image/*,video/*" multiple>
      </label>

      <br><br>

      <button id="saveBtn">Save</button>
      <button id="clearBtn">Clear</button>
      <span id="uploadProgress" style="margin-left:12px;"></span>
    </div>
  </div>

  <div class="preview" id="preview" hidden>
    <div id="instagramPreview">
      <div id="carousel" class="carousel"></div>

      <div class="carousel-controls">
        <button id="prevSlide">←</button>
        <button id="nextSlide">→</button>
      </div>

      <p id="caption"></p>
    </div>

    <div id="linkedinPreview" hidden>
      <div class="linkedin-card">
        <div class="linkedin-header">
          <div class="linkedin-avatar">SB</div>
          <div class="linkedin-meta">
            <strong id="linkedinBrand">Client Preview</strong><br>
            <span>Preview only</span>
          </div>
        </div>

        <div id="linkedinCaption" class="linkedin-caption"></div>
        <div id="linkedinMedia" class="linkedin-media"></div>
      </div>
    </div>
  </div>
</div>



<script type="module">
import { supabase } from "/assets/js/supabase.js";

/* ---------- AUTH ---------- */
const { data: sessionData } = await supabase.auth.getSession();
const user = sessionData?.session?.user;

if (!user || user.user_metadata.role !== "admin") {
  window.location.href = "/admin/login/";
  throw new Error("Not authorised");
}

/* ---------- DOM ---------- */
const grid = document.getElementById("grid");
const preview = document.getElementById("preview");
const carousel = document.getElementById("carousel");
const captionEl = document.getElementById("caption");

const clientSelect = document.getElementById("clientSelect");
const platformSelect = document.getElementById("platformSelect");
const aspectSelect = document.getElementById("aspectSelect");
const captionInput = document.getElementById("captionInput");
const saveBtn = document.getElementById("saveBtn");
const editor = document.getElementById("editor");
const uploadProgress = document.getElementById("uploadProgress");

const instagramPreview = document.getElementById("instagramPreview");
const linkedinPreview = document.getElementById("linkedinPreview");
const linkedinCaption = document.getElementById("linkedinCaption");
const linkedinMedia = document.getElementById("linkedinMedia");
const linkedinBrand = document.getElementById("linkedinBrand");

const thumbInput = document.getElementById("thumbInput");
const mediaInput = document.getElementById("mediaInput");

const prevBtn = document.getElementById("prevSlide");
const nextBtn = document.getElementById("nextSlide");
const clearBtn = document.getElementById("clearBtn");
  const addNewBtn = document.getElementById("addNewBtn");

/* ---------- STATE ---------- */
let currentClient = clientSelect.value;
let currentPost = null;
let slides = [];
let currentSlideIndex = 0;

/* ---------- HELPERS ---------- */
function storagePathFromPublicUrl(publicUrl) {
  // Converts: https://xyz.supabase.co/storage/v1/object/public/social-media/client/slot-1/01.jpg
  // Into:      client/slot-1/01.jpg
  try {
    const u = new URL(publicUrl);
    const marker = "/storage/v1/object/public/social-media/";
    const idx = u.pathname.indexOf(marker);
    if (idx === -1) return null;
    return decodeURIComponent(u.pathname.slice(idx + marker.length));
  } catch {
    return null;
  }
}

async function removeFilesForPost(post) {
  const paths = [];

  if (post?.thumbnail_url) {
    const p = storagePathFromPublicUrl(post.thumbnail_url.split("?")[0]);
    if (p) paths.push(p);
  }

  (post?.media_urls || []).forEach((url) => {
    const p = storagePathFromPublicUrl(String(url).split("?")[0]);
    if (p) paths.push(p);
  });

  if (!paths.length) return;

  const { error } = await supabase.storage
    .from("social-media")
    .remove(paths);

  if (error) console.error("Storage remove failed:", error);
}
  async function loadPosts(client) {
  const { data, error } = await supabase
    .from("posts")
    .select("*")
    .eq("client", client)
    .order("slot");

  if (error) {
    console.error(error);
    return [];
  }

  return data;
}

async function uploadFile(path, file) {
  const { error } = await supabase.storage
    .from("social-media")
    .upload(path, file, { upsert: true });

  if (error) throw error;

  return supabase.storage
    .from("social-media")
    .getPublicUrl(path).data.publicUrl;
}

function showSlide(index) {
  slides.forEach((el, i) => {
    el.classList.toggle("active", i === index);
    el.classList.toggle("prev", i < index);
  });
}

function createMediaElement(url) {
  const cleanUrl = url.split("?")[0].toLowerCase();
  let el;

  if (cleanUrl.endsWith(".webm") || cleanUrl.endsWith(".mp4")) {
    el = document.createElement("video");
    el.src = url;
    el.muted = true;
    el.playsInline = true;
    el.loop = true;
    el.autoplay = true;
    el.controls = false;
  } else {
    el = document.createElement("img");
    el.src = url;
  }

  return el;
}

function setPreviewMode(platform) {
  if (platform === "linkedin") {
    instagramPreview.hidden = true;
    linkedinPreview.hidden = false;
  } else {
    instagramPreview.hidden = false;
    linkedinPreview.hidden = true;
  }
}

function renderLinkedInMedia(urls) {
  linkedinMedia.innerHTML = "";

  const count = urls.length;

  if (!count) return;

  if (count === 1) linkedinMedia.className = "linkedin-media one";
  else if (count === 2) linkedinMedia.className = "linkedin-media two";
  else if (count === 3) linkedinMedia.className = "linkedin-media three";
  else linkedinMedia.className = "linkedin-media four-plus";

  const visibleUrls = urls.slice(0, 4);

  visibleUrls.forEach((url, index) => {
    const tile = document.createElement("div");
    tile.className = "linkedin-tile";

    const mediaEl = createMediaElement(url);
    tile.appendChild(mediaEl);

    if (count > 4 && index === 3) {
      const more = document.createElement("div");
      more.className = "linkedin-more";
      more.textContent = `+${count - 4}`;
      tile.appendChild(more);
    }

    linkedinMedia.appendChild(tile);
  });
}

function renderPostPreview(post) {
  const platform = post?.platform || "instagram";

  setPreviewMode(platform);

  if (platform === "linkedin") {
    linkedinBrand.textContent = currentClient;
    linkedinCaption.textContent = post?.caption || "";
    renderLinkedInMedia(post?.media_urls || []);
    return;
  }

  carousel.innerHTML = "";
  slides = [];
  currentSlideIndex = 0;

  (post?.media_urls || []).forEach((url, i) => {
    const el = createMediaElement(url);

    if (i === 0) el.classList.add("active");
    carousel.appendChild(el);
    slides.push(el);
  });

  carousel.style.aspectRatio =
    post?.aspect === "9:16" ? "9 / 16" : "4 / 5";

  carousel.style.maxHeight =
    post?.aspect === "9:16" ? "1344px" : "630px";

  captionEl.textContent = post?.caption || "";
}

/* ---------- GRID RENDER ---------- */
async function render(client) {
  grid.innerHTML = "";
  preview.hidden = true;
  editor.hidden = true;

  const posts = await loadPosts(client);
  const slots = Array.from({ length: 12 }, (_, i) => i + 1);

  slots.forEach(slot => {
    const post = posts.find(p => p.slot === slot);

    const img = document.createElement("img");
    img.src = post?.thumbnail_url || "/assets/empty.png";

    img.onclick = () => {
      carousel.innerHTML = "";
slides = [];
currentSlideIndex = 0;

      currentPost = {
        id: post?.id || null,
        client: currentClient,
        slot: slot
      };

      preview.hidden = false;
      editor.hidden = false;

      /* Build carousel */
  platformSelect.value = post?.platform || "instagram";
captionInput.value = post?.caption || "";
aspectSelect.value = post?.aspect || "5:4";

renderPostPreview(post || {
  platform: "instagram",
  caption: "",
  aspect: "5:4",
  media_urls: []
});
    };

    grid.appendChild(img);
  });
}

/* ---------- NAV ---------- */
prevBtn.onclick = () => {
  if (!slides.length) return;
  currentSlideIndex =
    (currentSlideIndex - 1 + slides.length) % slides.length;
  showSlide(currentSlideIndex);
};

nextBtn.onclick = () => {
  if (!slides.length) return;
  currentSlideIndex =
    (currentSlideIndex + 1) % slides.length;
  showSlide(currentSlideIndex);
};

/* ---------- SAVE ---------- */
saveBtn.onclick = async () => {
  if (!currentPost) return;
  uploadProgress.textContent = "0%";

  // 1) If this is a NEW post (id is null), create the DB row first to get an id
  if (!currentPost.id) {
    const { data: inserted, error: insertError } = await supabase
      .from("posts")
     .insert({
  client: currentPost.client,
  slot: currentPost.slot,
  platform: platformSelect.value,
  caption: captionInput.value,
  aspect: aspectSelect.value,
  thumbnail_url: null,
  media_urls: []
})
      .select("id")
      .single();

    if (insertError) {
      alert("Save failed (could not create post)");
      console.error(insertError);
      return;
    }

    currentPost.id = inserted.id;
  } else {
    // 2) Existing post: delete its currently linked files (safe because it uses URLs)
    const { data: existing, error: existingError } = await supabase
      .from("posts")
      .select("thumbnail_url,media_urls")
      .eq("id", currentPost.id)
      .single();

    if (existingError) {
      alert("Save failed (could not load existing post)");
      console.error(existingError);
      return;
    }

    await removeFilesForPost(existing);
  }

  // 3) Upload into stable folder: client/post-<id>/
  const folder = `${currentPost.client}/post-${currentPost.id}`;

  let thumbnailUrl = null;
  let mediaUrls = [];
  const cacheBust = Date.now();
  const totalUploads = (thumbInput.files[0] ? 1 : 0) + mediaInput.files.length;
let uploadedCount = 0;

function updateProgress() {
  if (!totalUploads) {
    uploadProgress.textContent = "";
    return;
  }

  const percent = Math.round((uploadedCount / totalUploads) * 100);
  uploadProgress.textContent = `${percent}%`;
}

  // Thumbnail (optional)
  if (thumbInput.files[0]) {
    const thumbPublicUrl = await uploadFile(
      `${folder}/thumb.jpg`,
      thumbInput.files[0]
    );
    thumbnailUrl = `${thumbPublicUrl}?v=${cacheBust}`;
    uploadedCount++;
updateProgress();
  }

  // Media (if none selected, it becomes empty array)
  if (mediaInput.files.length) {
    for (let i = 0; i < mediaInput.files.length; i++) {
      const file = mediaInput.files[i];
      const ext = file.name.split(".").pop();

      const publicUrl = await uploadFile(
        `${folder}/${String(i + 1).padStart(2, "0")}.${ext}`,
        file
      );

      mediaUrls.push(`${publicUrl}?v=${cacheBust}`);
      uploadedCount++;
updateProgress();
    }
  } else {
    mediaUrls = [];
  }

  // 4) Update the DB row with final URLs and latest fields
const payload = {
  platform: platformSelect.value,
  caption: captionInput.value,
  aspect: aspectSelect.value,
  media_urls: mediaUrls,
  ...(thumbnailUrl && { thumbnail_url: thumbnailUrl })
};

  const { error: updateError } = await supabase
    .from("posts")
    .update(payload)
    .eq("id", currentPost.id);

  if (updateError) {
    alert("Save failed (could not update post)");
    console.error(updateError);
    return;
  }
uploadProgress.textContent = "";
  render(currentClient);
};

  /* ---------- CLEAR ---------- */
clearBtn.onclick = async () => {
  if (!currentPost) return;

if (currentPost.id) {
  const { data: existing } = await supabase
    .from("posts")
    .select("thumbnail_url,media_urls")
    .eq("id", currentPost.id)
    .single();

  await removeFilesForPost(existing);
}

  const { error } = await supabase
    .from("posts")
  .update({
  thumbnail_url: null,
  media_urls: [],
  platform: "instagram",
  caption: "",
  aspect: "5:4"
})
    .eq("client", currentPost.client)
    .eq("slot", currentPost.slot);

  if (error) {
    alert("Clear failed");
    console.error(error);
    return;
  }

  carousel.innerHTML = "";
  slides = [];
  preview.hidden = true;

captionInput.value = "";
platformSelect.value = "instagram";
aspectSelect.value = "5:4";
thumbInput.value = "";
mediaInput.value = "";

  render(currentClient);
};
  /* ---------- SHIFT + NEW ---------- */
addNewBtn.onclick = async () => {
  // 1) Load current posts
  const posts = await loadPosts(currentClient);

  // 2) Delete Slot 12 (DB + Storage)
  const slot12 = posts.find(p => p.slot === 12);
  if (slot12) {
    await removeFilesForPost(slot12);

    await supabase
      .from("posts")
      .delete()
      .eq("id", slot12.id);
  }

  // 3) Shift 11 -> 12, 10 -> 11 ... 1 -> 2 (descending avoids collisions)
  for (let s = 11; s >= 1; s--) {
    const p = posts.find(x => x.slot === s);
    if (!p) continue;

    const { error } = await supabase
      .from("posts")
      .update({ slot: s + 1 })
      .eq("id", p.id);

    if (error) {
      alert("Shift failed. Check console.");
      console.error(error);
      return;
    }
  }

  // 4) Refresh grid
  await render(currentClient);
// Reset preview/editor state (prevents stale slot-1 preview)
currentPost = null;
carousel.innerHTML = "";
slides = [];
currentSlideIndex = 0;

preview.hidden = true;
editor.hidden = true;

captionEl.textContent = "";
captionInput.value = "";
platformSelect.value = "instagram";
thumbInput.value = "";
mediaInput.value = "";
aspectSelect.value = "5:4";
carousel.style.aspectRatio = "4 / 5";
  
  // 5) Set editor to “new post in Slot 1”
  currentPost = { id: null, client: currentClient, slot: 1 };
  preview.hidden = false;
  editor.hidden = false;

  carousel.innerHTML = "";
  slides = [];
  currentSlideIndex = 0;

captionInput.value = "";
captionEl.textContent = "";
platformSelect.value = "instagram";
aspectSelect.value = "5:4";
thumbInput.value = "";
mediaInput.value = "";

  // Optional: set default aspect preview
  carousel.style.aspectRatio = "4 / 5";
};
platformSelect.onchange = async () => {
  if (currentPost?.id) {
    const { data: freshPost } = await supabase
      .from("posts")
      .select("*")
      .eq("id", currentPost.id)
      .single();

    renderPostPreview({
      ...freshPost,
      platform: platformSelect.value,
      caption: captionInput.value,
      aspect: aspectSelect.value
    });
  } else {
    renderPostPreview({
      platform: platformSelect.value,
      caption: captionInput.value,
      aspect: aspectSelect.value,
      media_urls: []
    });
  }
};
  
  /* ---------- INIT ---------- */
clientSelect.onchange = () => {
  currentClient = clientSelect.value;
  render(currentClient);
};

render(currentClient);

</script>



</body>
</html>
