<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body { font-family: sans-serif; background:#111; color:#fff; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .slot { background:#222; height:200px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .editor { margin-top:20px; }
    .preview { margin-top:20px; }

    /* LinkedIn */
    .li-card { background:#fff; color:#000; border-radius:8px; overflow:hidden; max-width:500px; }
    .li-header { padding:12px; font-weight:bold; }
    .li-caption { padding:12px; white-space:pre-line; }
    .li-grid { display:grid; gap:2px; }
    .li-grid img { width:100%; height:100%; object-fit:cover; }

    .overlay {
      position:fixed; inset:0; background:#000; display:none;
      align-items:center; justify-content:center;
    }
    .overlay img { max-width:90%; max-height:90%; }
  </style>
</head>
<body>

<h2>Admin</h2>

<select id="clientSelect"></select>

<div class="grid" id="grid"></div>

<div class="editor">
  <h3>Editor</h3>

  <select id="platform">
    <option value="instagram">Instagram</option>
    <option value="linkedin">LinkedIn</option>
  </select>

  <textarea id="caption" placeholder="Caption"></textarea>

  <input type="file" id="media" multiple>

  <div id="uploadProgress">0%</div>

  <button onclick="save()">Save</button>
</div>

<div class="preview" id="preview"></div>

<div class="overlay" id="overlay" onclick="this.style.display='none'">
  <img id="overlayImg">
</div>

<script>
const supabase = supabase.createClient("YOUR_URL","YOUR_KEY");

let currentSlot = null;
let mediaFiles = [];

document.getElementById("media").onchange = e=>{
  mediaFiles = Array.from(e.target.files);
  renderPreview();
};

function renderPreview(){
  const platform = document.getElementById("platform").value;
  const caption = document.getElementById("caption").value;

  if(platform==="linkedin"){
    renderLinkedInPreview(caption);
  } else {
    document.getElementById("preview").innerHTML = "<p>Instagram preview placeholder</p>";
  }
}

function renderLinkedInPreview(caption){
  const container = document.getElementById("preview");

  let grid = "";

  if(mediaFiles.length===1){
    grid = `<img src="${URL.createObjectURL(mediaFiles[0])}">`;
  }
  else if(mediaFiles.length===2){
    grid = `<div class="li-grid" style="grid-template-columns:1fr 1fr">
      ${mediaFiles.map(f=>`<img src="${URL.createObjectURL(f)}">`).join("")}
    </div>`;
  }
  else if(mediaFiles.length>=3){
    const first = URL.createObjectURL(mediaFiles[0]);
    const others = mediaFiles.slice(1,4);

    grid = `
      <div class="li-grid" style="grid-template-columns:2fr 1fr">
        <img src="${first}">
        <div class="li-grid">
          ${others.map(f=>`<img src="${URL.createObjectURL(f)}">`).join("")}
        </div>
      </div>
    `;

    if(mediaFiles.length>4){
      grid += `<div>+${mediaFiles.length-4}</div>`;
    }
  }

  container.innerHTML = `
    <div class="li-card">
      <div class="li-header">Belmo Group</div>
      <div class="li-caption">${caption}</div>
      ${grid}
    </div>
  `;
}

async function save(){
  const progress = document.getElementById("uploadProgress");

  let uploaded = [];

  for(let i=0;i<mediaFiles.length;i++){
    const file = mediaFiles[i];

    const path = `client/post-${Date.now()}/${file.name}`;

    await supabase.storage.from("social-media").upload(path,file,{upsert:true});

    const { data } = supabase.storage.from("social-media").getPublicUrl(path);

    uploaded.push(data.publicUrl);

    progress.innerText = Math.round(((i+1)/mediaFiles.length)*100)+"%";
  }

  await supabase.from("posts").insert({
    slot: currentSlot,
    caption: document.getElementById("caption").value,
    media_urls: uploaded,
    platform: document.getElementById("platform").value
  });

  alert("Saved");
}
</script>

</body>
</html>
