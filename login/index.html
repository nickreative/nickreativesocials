<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nickreative — Client Sign In</title><link rel="stylesheet" href="/assets/css/editorial.css"></head>
<body><div class="page auth-page"><header class="topbar"><div class="brand-block"><p class="brand">Nickreative</p><span class="product-name">Socials · Client access</span></div></header>
<main class="auth-layout"><section class="auth-intro"><span class="eyebrow">The content studio</span><h1>Social media content<br>management suite</h1><p>Preview your upcoming content, share feedback and approve the posts that tell your brand's story.</p></section><section class="auth-form" aria-labelledby="loginHeading"><span class="eyebrow">Client portal</span><h2 id="loginHeading">Welcome back</h2><form id="loginForm"><label for="email">Email address<input type="email" id="email" autocomplete="username" required></label><label for="password">Password</label><div class="password-field"><input aria-label="Password" type="password" id="password" autocomplete="current-password" required><button type="button" id="showPassword" aria-pressed="false" aria-controls="password">Show</button></div><p id="error" class="notice" role="status" aria-live="polite"></p><button class="primary" type="submit">Sign in</button></form><p class="auth-switch"><a href="/admin/login/">Switch to admin access →</a></p></section></main></div>
<script type="module">
  import { supabase } from "/assets/js/supabase.js";

  const form = document.getElementById("loginForm");
  const errorEl = document.getElementById("error");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const submit = form.querySelector("button[type=submit]");
    submit.disabled = true;
    submit.textContent = "Signing in…";
    errorEl.textContent = "";
    try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      errorEl.textContent = error.message;
      return;
    }

    const meta = data.user.user_metadata;

    if (meta.role === "client") {
      window.location.href = `/client/portal/?client=${meta.client}`;
    } else {
      errorEl.textContent = "Not a client account.";
    }
    } catch {
      errorEl.textContent = "Could not connect. Please try again.";
    } finally {
      submit.disabled = false;
      submit.textContent = "Sign in";
    }
  });

  document.getElementById("showPassword").onclick = (event) => {
    const input = document.getElementById("password");
    const visible = input.type === "password";
    input.type = visible ? "text" : "password";
    event.currentTarget.textContent = visible ? "Hide" : "Show";
    event.currentTarget.setAttribute("aria-pressed", String(visible));
  };
</script></body></html>
